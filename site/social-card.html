<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>time-blame social preview artwork</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { width: 1280px; height: 640px; padding: 56px 72px; display: flex; flex-direction: column; }
    .wordmark { font-size: 36px; }
    .wordmark img { width: 48px; height: 48px; }
    h1 { font-size: 72px; max-width: none; margin: auto 0 32px; }
    .card-bar { display: grid; grid-template-columns: 31fr 19fr 49fr 1fr; gap: 3px; height: 64px; }
    .cseg { border-radius: 4px; }
    .card-key { display: grid; grid-template-columns: 31fr 19fr 49fr 1fr; gap: 3px; margin: 12px 0 auto; font: 400 22px/1.3 var(--heading); }
    .card-key b { font-weight: 500; margin-right: 6px; }
    .caption { display: flex; justify-content: space-between; color: var(--muted); font-size: 22px; }
  </style>
</head>
<body>
  <div class="wordmark"><img src="favicon.svg" width="48" height="48" alt="">time-blame</div>
  <h1>Is Claude slow,<br>or is it your npm test?</h1>
  <div class="card-bar" aria-hidden="true">
    <div class="cseg b-claude"></div><div class="cseg b-tools"></div><div class="cseg b-you"></div><div class="cseg b-other"></div>
  </div>
  <div class="card-key" aria-hidden="true"><span><b>Claude</b> 8.0s</span><span><b>tools</b> 4.7s</span><span><b>you</b> 12s</span><span></span></div>
  <div class="caption"><span>A Claude Code mod that splits every turn by who made you wait.</span><span>timeblame.aidojo.si</span></div>
</body>
</html>
